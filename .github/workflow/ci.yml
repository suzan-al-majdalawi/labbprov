name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Konfigurera Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installera beroenden
        run: npm ci

      - name: Kör tester
        run: npm run test:run

      - name: Bygg produktionsversion
        run: npm run build

      - name: Spara byggresultat
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist